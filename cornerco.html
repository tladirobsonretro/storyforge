<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CornerCo | Water & Ice</title><style>
:root{--b:#1648bd;--s:#55b8f4;--p:#edf7ff;--ink:#17243b;--muted:#6b7890;--line:#dce8f4}*{box-sizing:border-box}body{margin:0;background:#f5f9fe;color:var(--ink);font:15px system-ui,Arial}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;font-weight:700}.top{background:linear-gradient(110deg,#123da6,var(--b));color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{background:white;color:var(--b);border-radius:12px;padding:10px 14px;font-size:20px;font-weight:900}.brand h1{margin:0;font-size:21px}.brand p{margin:2px 0;color:#d9ebff;font-size:12px}.who{display:flex;gap:8px;align-items:center}.who select{padding:10px;border-radius:9px;border:0}.nav{display:flex;gap:7px;padding:12px 22px;background:white;border-bottom:1px solid var(--line);overflow:auto}.nav button{background:transparent;color:var(--muted);white-space:nowrap}.nav .active,.secondary{background:var(--p);color:var(--b)}main{max-width:1200px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.head h2{margin:0;font-size:25px}.sub,.muted{color:var(--muted)}.primary{background:var(--b);color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.stat,.panel,.product{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 4px 15px #1d4e8909}.stat label{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:24px;margin:6px 0}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.product{text-align:left}.product:hover{border-color:var(--s)}.product h3{margin:8px 0 3px}.price{color:var(--b);font-weight:800}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:8px;margin-top:6px}.qty button{padding:3px 9px;background:var(--p);color:var(--b)}.total{display:flex;justify-content:space-between;padding:16px 0;font-size:19px;font-weight:800}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:13px;font-weight:700}.field input,.field select{padding:10px;border:1px solid #ccdbea;border-radius:8px;width:100%;background:white}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:520px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:12px;text-transform:uppercase}.empty{padding:24px;text-align:center;color:var(--muted)}.notice{background:#fff8df;border:1px solid #f2df9e;color:#755b12;padding:12px;border-radius:10px;margin-top:15px;font-size:13px}.modalback{position:fixed;inset:0;background:#10213c88;display:grid;place-items:center;padding:20px}.modal{background:white;border-radius:16px;padding:22px;width:min(480px,100%)}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#10213c;color:white;padding:12px 18px;border-radius:10px}.hide{display:none}.pill{background:var(--p);color:var(--b);border-radius:20px;padding:4px 8px;font-size:12px}@media(max-width:760px){main{padding:14px}.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.top{padding:14px}.nav{padding:10px}.stat strong{font-size:21px}}@media(max-width:430px){.who{width:100%}.who select{flex:1}.products{gap:7px}.product{padding:12px}.head h2{font-size:22px}}
</style></head><body><header class="top"><div class="brand"><div class="logo">C</div><div><h1>CornerCo</h1><p>WATER & ICE DISPENSARY</p></div></div><div class="who"><span>Who's at the counter?</span><select id="staff"></select><button class="secondary" onclick="staffModal()">+ Name</button></div></header><nav class="nav" id="nav"><button class="active" data-p="pos">Point of sale</button><button data-p="dash">Dashboard</button><button data-p="expenses">Expenses</button><button data-p="stock">Products & stock</button><button data-p="reports">Reports</button></nav><main id="app"></main><div id="modal"></div><div id="toast" class="toast hide"></div>
<script>
const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(Number(n)||0),date=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults=[['refill5','5L Water Refill','Water refill',8,2,100,'💧'],['refill10','10L Water Refill','Water refill',15,4,100,'💧'],['refill20','20L Water Refill','Water refill',25,7,100,'🚰'],['prep5','Prepared Water 5L','Prepared water',18,8,30,'🫙'],['b500','Sealed Water 500ml','Bottled water',7,3,60,'🧴'],['b15','Sealed Water 1.5L','Bottled water',12,5,40,'🧴'],['ice2','Ice Bag 2kg','Ice',18,8,30,'🧊'],['ice5','Ice Bag 5kg','Ice',35,17,20,'🧊']].map(a=>({id:a[0],name:a[1],category:a[2],price:a[3],cost:a[4],stock:a[5],emoji:a[6]}));
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem('cc_'+k))??d}catch{return d}},save=()=>{for(const k of ['products','sales','expenses','staff'])localStorage.setItem('cc_'+k,JSON.stringify(state[k]))};
let state={products:get('products',defaults),sales:get('sales',[]),expenses:get('expenses',[]),staff:get('staff',[])},cart=[],page='pos';
function staffName(){return $('staff').value}
function initStaff(){let old=localStorage.getItem('cc_active')||'';$('staff').innerHTML='<option value="">Select staff member</option>'+state.staff.map(n=>'<option>'+esc(n)+'</option>').join('');if(state.staff.includes(old))$('staff').value=old;$('staff').onchange=()=>{localStorage.setItem('cc_active',$('staff').value);render()}}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),2200)}
function modal(title,body,savefn){$('modal').innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>'+title+'</h3>'+body+'<div class="modalfoot"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" id="savebtn">Save</button></div></div></div>';$('savebtn').onclick=savefn}
function closeModal(){$('modal').innerHTML=''}
function staffModal(){modal('Add staff member','<p class="muted">Save a name once on this device so it can be selected next time.</p><div class="field"><label>Staff name</label><input id="newstaff" placeholder="Enter name" maxlength="60"></div>',()=>{let n=$('newstaff').value.trim();if(!n)return toast('Enter a name');if(state.staff.some(x=>x.toLowerCase()===n.toLowerCase()))return toast('Name already saved');state.staff.push(n);localStorage.setItem('cc_active',n);save();closeModal();render();toast('Staff name saved')})}
function head(t,s,action=''){return '<div class="head"><div><h2>'+t+'</h2><div class="sub">'+s+'</div></div>'+action+'</div>'}
function metric(t,n,s){return '<div class="stat"><label>'+t+'</label><strong>'+fmt(n)+'</strong><span class="muted">'+s+'</span></div>'}
function totals(rows){let revenue=rows.reduce((a,s)=>a+s.total,0),cost=rows.reduce((a,s)=>a+s.items.reduce((v,i)=>v+i.cost*i.qty,0),0);return {revenue,cost,gross:revenue-cost}}
function table(rows){return rows.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Date / time</th><th>Staff</th><th>Items</th><th>Payment</th><th>Total</th></tr></thead><tbody>'+rows.map(s=>'<tr><td>'+esc(s.date)+'<br><span class="muted">'+esc(s.time)+'</span></td><td>'+esc(s.staff)+'</td><td>'+s.items.reduce((a,i)=>a+i.qty,0)+'</td><td>'+esc(s.payment)+'</td><td><b>'+fmt(s.total)+'</b></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No sales recorded yet.</div>'}
function cartMarkup(){return cart.length?cart.map(i=>'<div class="row"><div><b>'+esc(i.name)+'</b><div class="muted">'+fmt(i.price)+' each</div><div class="qty"><button onclick="qty(\''+i.id+'\',-1)">−</button>'+i.qty+'<button onclick="qty(\''+i.id+'\',1)">+</button></div></div><b>'+fmt(i.price*i.qty)+'</b></div>').join(''):'<div class="empty">Tap a product to begin.</div>'}
function add(id){let p=state.products.find(x=>x.id===id),i=cart.find(x=>x.id===id);if((i?.qty||0)>=p.stock)return toast('Stock limit reached');if(i)i.qty++;else cart.push({...p,qty:1});render()}
function qty(id,n){let i=cart.find(x=>x.id===id),p=state.products.find(x=>x.id===id);i.qty+=n;if(i.qty<1)cart=cart.filter(x=>x.id!==id);if(i&&p&&i.qty>p.stock)i.qty=p.stock;render()}
function checkout(){if(!staffName())return toast('Select who's at the counter');if(!cart.length)return;for(let i of cart)if(state.products.find(p=>p.id===i.id).stock<i.qty)return toast('Check available stock');let sale={id:Date.now(),date:date(),time:new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}),staff:staffName(),payment:$('payment').value,items:cart.map(i=>({...i})),total:cart.reduce((a,i)=>a+i.price*i.qty,0)};cart.forEach(i=>state.products.find(p=>p.id===i.id).stock-=i.qty);state.sales.unshift(sale);cart=[];save();render();toast('Sale recorded: '+fmt(sale.total))}
function render(){initStaff();$('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.p===page));if(page==='pos'&&!staffName()){$('app').innerHTML=head('Point of sale','Choose who is serving first.')+'<div class="panel" style="text-align:center;max-width:520px;margin:auto"><div style="font-size:42px">👋</div><h3>Who’s at the counter?</h3><p class="muted">Add a name once, then select it on future visits from this device.</p><button class="primary" onclick="staffModal()">Add staff name</button></div>';return}
if(page==='pos'){$('app').innerHTML=head('Point of sale','Tap a product to add it to the sale.','<span class="pill">Serving: '+esc(staffName())+'</span>')+'<div class="layout"><section class="products">'+state.products.filter(p=>p.stock>0).map(p=>'<button class="product" onclick="add(\''+p.id+'\')"><span style="font-size:25px">'+p.emoji+'</span><h3>'+esc(p.name)+'</h3><div class="price">'+fmt(p.price)+'</div><small class="muted">'+p.stock+' in stock</small></button>').join('')+'</section><aside class="panel"><h3>Current sale</h3>'+cartMarkup()+'<div class="total"><span>Total</span><span>'+fmt(cart.reduce((a,i)=>a+i.price*i.qty,0))+'</span></div><div class="field"><label>Payment method</label><select id="payment"><option>Cash</option><option>Card</option><option>Instant EFT</option><option>Other</option></select></div><button class="primary" style="width:100%" onclick="checkout()">Complete sale</button><button class="secondary" style="width:100%;margin-top:8px" onclick="cart=[];render()">Clear sale</button></aside></div>'}
if(page==='dash'){let ss=state.sales.filter(s=>s.date===date()),t=totals(ss),ex=state.expenses.filter(e=>e.date===date()).reduce((a,e)=>a+e.amount,0);$('app').innerHTML=head('Dashboard','A quick look at today.')+'<div class="stats">'+metric('Sales today',t.revenue,ss.length+' transactions')+metric('Cost of items sold',t.cost,'Estimated product cost')+metric('Gross profit',t.gross,'Sales minus product costs')+metric('Net after expenses',t.gross-ex,'After recorded expenses')+'</div><div class="panel"><h3>Recent sales</h3>'+table(state.sales.slice(0,8))+'</div><div class="notice">Profit is estimated from the unit costs entered for each product. Do not record stock purchases as ordinary expenses as well, or costs may be counted twice.</div>'}
if(page==='expenses'){$('app').innerHTML=head('Expenses','Record running costs.','<button class="primary" onclick="expenseModal()">+ Add expense</button>')+'<div class="panel">'+(state.expenses.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Expense</th><th>Category</th><th>Paid by</th><th>Amount</th><th></th></tr></thead><tbody>'+state.expenses.slice().reverse().map(e=>'<tr><td>'+e.date+'</td><td>'+esc(e.name)+'</td><td>'+esc(e.category)+'</td><td>'+esc(e.paidBy)+'</td><td>'+fmt(e.amount)+'</td><td><button class="secondary" onclick="removeExpense('+e.id+')">Remove</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No expenses recorded yet.</div>')+'</div>'}
if(page==='stock'){$('app').innerHTML=head('Products & stock','Edit selling price, unit cost and stock.','<button class="primary" onclick="productModal()">+ Add product</button>')+'<div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Unit cost</th><th>Stock</th><th></th></tr></thead><tbody>'+state.products.map(p=>'<tr><td>'+p.emoji+' '+esc(p.name)+'</td><td>'+esc(p.category)+'</td><td>'+fmt(p.price)+'</td><td>'+fmt(p.cost)+'</td><td>'+p.stock+'</td><td><button class="secondary" onclick="productModal(\''+p.id+'\')">Edit</button></td></tr>').join('')+'</tbody></table></div></div><div class="notice">When new stock arrives, increase the quantity here and update unit cost if needed.</div>'}
if(page==='reports'){let m=date().slice(0,7),ss=state.sales.filter(s=>s.date.startsWith(m)),t=totals(ss),ex=state.expenses.filter(e=>e.date.startsWith(m)).reduce((a,e)=>a+e.amount,0),staff={};ss.forEach(s=>{staff[s.staff]??={count:0,total:0};staff[s.staff].count++;staff[s.staff].total+=s.total});$('app').innerHTML=head('Reports','Month to date: '+m,'<button class="secondary" onclick="exportCsv()">Export sales CSV</button>')+'<div class="stats">'+metric('Sales',t.revenue,ss.length+' transactions')+metric('Gross profit',t.gross,'After product costs')+metric('Net estimate',t.gross-ex,'After recorded expenses')+metric('Expenses',ex,'This month')+'</div><div class="panel"><h3>Sales by staff</h3>'+(Object.keys(staff).length?'<table class="table"><thead><tr><th>Staff member</th><th>Transactions</th><th>Sales</th></tr></thead><tbody>'+Object.entries(staff).map(([n,v])=>'<tr><td>'+esc(n)+'</td><td>'+v.count+'</td><td>'+fmt(v.total)+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">No sales this month.</div>')+'</div><div class="panel" style="margin-top:16px"><h3>Sales history</h3>'+table(state.sales)+'</div>'}}
function expenseModal(){modal('Add expense','<div class="field"><label>Expense name</label><input id="en" placeholder="Electricity, rent, transport..."></div><div class="field"><label>Amount (R)</label><input id="ea" type="number" min=".01" step=".01"></div><div class="field"><label>Date</label><input id="ed" type="date" value="'+date()+'"></div><div class="field"><label>Category</label><select id="ec"><option>Utilities</option><option>Rent</option><option>Transport</option><option>Packaging</option><option>Repairs</option><option>Supplies</option><option>Other</option></select></div><div class="field"><label>Paid by</label><input id="ep" value="'+esc(staffName())+'"></div>',()=>{let name=$('en').value.trim(),amount=Number($('ea').value);if(!name||amount<=0)return toast('Enter a name and valid amount');state.expenses.push({id:Date.now(),name,amount,date:$('ed').value||date(),category:$('ec').value,paidBy:$('ep').value.trim()});save();closeModal();render();toast('Expense recorded')})}
function removeExpense(id){if(confirm('Remove this expense entry?')){state.expenses=state.expenses.filter(e=>e.id!==id);save();render()}}
function productModal(id){let p=state.products.find(x=>x.id===id)||{id:'p'+Date.now(),name:'',category:'Water refill',price:0,cost:0,stock:0,emoji:'💧'},fresh=!id;modal(fresh?'Add product':'Edit product','<div class="field"><label>Product name</label><input id="pn" value="'+esc(p.name)+'"></div><div class="field"><label>Category</label><select id="pc">'+['Water refill','Prepared water','Bottled water','Ice','Other'].map(c=>'<option '+(c===p.category?'selected':'')+'>'+c+'</option>').join('')+'</select></div><div class="field"><label>Icon</label><select id="pi">'+['💧','🚰','🫙','🧴','🧊','📦'].map(c=>'<option '+(c===p.emoji?'selected':'')+'>'+c+'</option>').join('')+'</select></div><div class="field"><label>Selling price (R)</label><input id="pp" type="number" min="0" step=".01" value="'+p.price+'"></div><div class="field"><label>Unit cost (R)</label><input id="pk" type="number" min="0" step=".01" value="'+p.cost+'"></div><div class="field"><label>Stock quantity</label><input id="pq" type="number" min="0" step="1" value="'+p.stock+'"></div>',()=>{let name=$('pn').value.trim(),price=Number($('pp').value),cost=Number($('pk').value),stock=Number($('pq').value);if(!name||price<0||cost<0||stock<0)return toast('Check product details');let next={...p,name,category:$('pc').value,emoji:$('pi').value,price,cost,stock};state.products=fresh?[...state.products,next]:state.products.map(x=>x.id===id?next:x);save();closeModal();render();toast('Product saved')})}
function exportCsv(){let lines=[['Date','Time','Staff','Payment','Items','Sales','Product cost','Gross profit'],...state.sales.map(s=>[s.date,s.time,s.staff,s.payment,s.items.map(i=>i.name+' x'+i.qty).join('; '),s.total,s.items.reduce((a,i)=>a+i.cost*i.qty,0),s.total-s.items.reduce((a,i)=>a+i.cost*i.qty,0)])];let csv=lines.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='cornerco-sales-'+date()+'.csv';a.click();URL.revokeObjectURL(a.href)}
$('nav').onclick=e=>{let b=e.target.closest('[data-p]');if(b){page=b.dataset.p;render()}};render();
</script></body></html>
